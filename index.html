<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="card text-white mx-auto p-4 shadow-lg">
            <div class="search d-flex justify-content-between mb-4">
                <input type="text" class="form-control search-input" placeholder="Enter City Name" spellcheck="false">
                <button class="btn btn-outline-light ms-3 search-button"><img src="images/search.png" alt="search" class="icon"></button>
            </div>
            <div class="weather text-center">
                <img src="images/rain.png" class="weather-icon mb-3">
                <h1 class="temp display-4"></h1>
                <h2 class="city"></h2>
                <div class="details d-flex justify-content-around mt-4">
                    <div class="col d-flex align-items-center">
                        <img src="images/humidity.png" class="me-2">
                        <div>
                            <p class="humidity h5">0%</p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="col d-flex align-items-center">
                        <img src="images/wind.png" class="me-2">
                        <div>
                            <p class="wind h5">0 km/h</p>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "d6dde42beeabae651e258934011291b1";
        const apiUrl = `https://api.openweathermap.org/data/2.5/weather?units=metric&appid=${apiKey}&q=`;

        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const weatherIcon = document.querySelector(".weather-icon");

        async function checkWeather(city) {
            const response = await fetch(apiUrl + city);
            const data = await response.json();

            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
            document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
            document.querySelector(".wind").innerHTML = data.wind.speed + "km/h";

            switch (data.weather[0].main) {
                case "Clouds":
                    weatherIcon.src = "images/cloud.png";
                    break;
                case "Clear":
                    weatherIcon.src = "images/clear.png";
                    break;
                case "Rain":
                    weatherIcon.src = "images/rain.png";
                    break;
                case "Drizzle":
                    weatherIcon.src = "images/drizzle.png";
                    break;
                case "Mist":
                    weatherIcon.src = "images/mist.png";
                    break;
                default:
                    weatherIcon.src = "images/default.png";
                    break;
            }
        }

        searchBtn.addEventListener("click", () => {
            checkWeather(searchBox.value);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
